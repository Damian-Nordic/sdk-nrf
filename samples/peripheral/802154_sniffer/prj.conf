# Enabling radio driver
CONFIG_NETWORKING=y
CONFIG_IEEE802154=y
CONFIG_IEEE802154_RAW_MODE=y
CONFIG_NET_PKT_TIMESTAMP=y

# Allow sharing the RTC between IEEE 802.15.4 and Zephyr
CONFIG_NRF_RTC_TIMER_USER_CHAN_COUNT=3

# Increase the number of RX buffers to minimize the chances of frame drops.
# The value must not be higher than 127 - X, where X is the number of notification
# slots reserved by the radio driver (see NTF_PRIMARY_POOL_SIZE macro definition).
CONFIG_NRF_802154_RX_BUFFERS=120

# Capture output encoding. Base64 needs a third fewer bytes than hex.
CONFIG_BASE64=y

# The capture buffer in sniffer_uart.c uses the ring buffer API directly.
CONFIG_RING_BUFFER=y

# Shell configuration
CONFIG_SHELL=y
CONFIG_SHELL_PROMPT_UART=""
CONFIG_SHELL_VT100_COLORS=n

# Sync lines are prioritized only while they sit in the sniffer ring buffer;
# once handed to the backend they queue behind the frame data in FIFO order.
# Keep this buffer small, so that it only has to keep the USB endpoint busy,
# and let the sniffer ring absorb the bursts.
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=2048

# Keep USB transfer handling off the system workqueue, which also runs the
# time sync reporting work.
CONFIG_USBD_CDC_ACM_WORKQUEUE=y

# The radio RX thread formats and queues every capture line, which needs more
# stack than the 800 bytes the driver defaults to.
CONFIG_IEEE802154_NRF5_RX_STACK_SIZE=2048

# LED indication
CONFIG_DK_LIBRARY=y

# USB configuration
CONFIG_UART_LINE_CTRL=y
CONFIG_SHELL_BACKEND_SERIAL_INIT_PRIORITY=51

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Nordic Semiconductor ASA"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="nRF 802154 Sniffer"
CONFIG_CDC_ACM_SERIAL_VID=0x1915
CONFIG_CDC_ACM_SERIAL_PID=0x154b

# Disable boot banner
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
